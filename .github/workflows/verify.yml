name: Verify
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check local startup script syntax
        run: node --check scripts/dev.mjs
      - name: Check multi-Jinn browser acceptance script syntax
        run: node --check scripts/test-local-jinns.mjs
      - name: Check localization browser acceptance script syntax
        run: node --check scripts/test-local-i18n.mjs
      - name: Check first-value browser and local fixture syntax
        run: |
          node --check scripts/test-local-first-value.mjs
          node --check scripts/local-first-value-model.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Foundation database tests
        run: npm run test:db
      - name: Build
        run: npm run build

  # Multi-Jinn, localization, and F03-003.1 correction PRs: isolated local Auth/Postgres/browser. Never hosted.
  local-browser:
    if: github.event_name == 'pull_request' && (github.event.pull_request.number == 21 || github.event.pull_request.number == 22 || github.event.pull_request.number == 23 || github.event.pull_request.number == 24)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CHROME_PATH: /usr/bin/google-chrome
      F03_WEB_URL: http://127.0.0.1:5173/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Start disposable local Supabase
        run: npx --yes supabase@3.1.0 start
      - name: Verify local migration and project guard
        run: npm run dev -- --check
      - name: Start local Wisht API and Vite
        run: |
          # Node's --env-file-if-exists still watches the named path in dev mode.
          # Clean CI has no personal env files. Provide empty local-only placeholders.
          touch .env web/.env.local
          if [ "${{ github.event.pull_request.number }}" = "24" ]; then
            node scripts/local-first-value-model.mjs > /tmp/jinn-local-model.log 2>&1 &
            export JINN_TEST_MODE=1
            export JINN_LOCAL_MODEL_ENDPOINT=http://127.0.0.1:3999/v1/chat/completions
          fi
          npm run dev > /tmp/wisht-dev.log 2>&1 &
          echo $! > /tmp/wisht-dev.pid
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/wisht-dev.log
          exit 1
      - name: Real local Auth/DB browser acceptance
        run: |
          if [ "${{ github.event.pull_request.number }}" = "24" ]; then
            npm run test:local-first-value
          elif [ "${{ github.event.pull_request.number }}" = "22" ]; then
            npm run test:local-i18n
          elif [ "${{ github.event.pull_request.number }}" = "23" ]; then
            npm run test:local-jinns
            npm run test:local-i18n
          else
            npm run test:local-jinns
          fi
      - name: Capture local browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jinn-browser-evidence
          path: |
            docs/evidence/f03-003/*.png
            docs/evidence/i18n/*.png
            docs/evidence/f03-004/*.png
          if-no-files-found: ignore
      - name: Print local startup diagnostics on failure
        if: failure()
        run: |
          test -f /tmp/wisht-dev.log && tail -n 90 /tmp/wisht-dev.log || true
      - name: Stop ephemeral local Supabase
        if: always()
        run: npx --yes supabase@3.1.0 stop || true

  # Run only with a repository-scoped provider secret. Never use hosted user data,
  # deploy a preview, or print the key. This is functional smoke, NOT the blind Wish.
  real-model-eval:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_PROVIDER: deepseek
      LLM_MODEL: deepseek-chat
      SUPABASE_SERVICE_ROLE_KEY: local-test-only-evaluation-signing-key-never-use-for-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Live model: known demonstration Wishes only
        run: |
          mkdir -p docs/evidence/f03-004
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::DEEPSEEK_API_KEY GitHub secret not configured; no real-model evidence generated. Do not mark blind-ready."
            echo "NOT CONFIGURED — cannot claim real-model evaluation" > docs/evidence/f03-004/real-model-status.txt
            exit 0
          fi
          node --import tsx api/src/server.ts > /tmp/jinn-real-model-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/eval-first-value-live.mjs
      - name: Upload real-model evidence or explicit missing-config marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f03-004-real-model-evidence
          path: |
            docs/evidence/f03-004/configured-real-model-evaluation.json
            docs/evidence/f03-004/real-model-status.txt
          if-no-files-found: ignore
