name: Verify
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check local startup script syntax
        run: node --check scripts/dev.mjs
      - name: Check multi-Jinn browser acceptance script syntax
        run: node --check scripts/test-local-jinns.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Foundation database tests
        run: npm run test:db
      - name: Build
        run: npm run build
