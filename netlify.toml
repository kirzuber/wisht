[build]
  command = "npm run build -w web"
  publish = "web/dist"
  functions = "netlify/functions"
  # Production only: PRs get GitHub CI, but Netlify must NOT build/publish previews.
  ignore = "if [ \"$CONTEXT\" = \"production\" ] && [ \"$BRANCH\" = \"main\" ]; then exit 1; else exit 0; fi"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
