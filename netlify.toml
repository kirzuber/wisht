[build]
  command = "npm run build -w web"
  publish = "web/dist"
  functions = "netlify/functions"
  # Publish main and the explicitly approved F04 PR preview only.
  ignore = "if { [ \"$CONTEXT\" = \"production\" ] && [ \"$BRANCH\" = \"main\" ]; } || [ \"$REVIEW_ID\" = \"33\" ]; then exit 1; else exit 0; fi"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
